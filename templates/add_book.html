{% extends "base.html" %}
{% block title %}Add Book - Smart Bookstore{% endblock %}
{% block content %}
<section class="add-book">
    <h2>Add a New Book</h2>
    <form method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ form.title }}" required>

        <label for="author">Author:</label>
        <input type="text" id="author" name="author" value="{{ form.author }}" required>

        <label for="category">Category:</label>
        <input type="text" id="category" name="category" value="{{ form.category }}">

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" min="0" step="0.01" value="{{ form.price }}" required>

        <label for="stock">Stock:</label>
        <input type="number" id="stock" name="stock" min="0" step="1" value="{{ form.stock }}" required>

        <button type="submit">Add Book</button>
    </form>
</section>
{% endblock %}

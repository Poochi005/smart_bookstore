<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - Smart Bookstore</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <h1>📚 Smart Bookstore</h1>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_book') }}">Add Book</a>
        <a href="{{ url_for('sales') }}">Sales</a>
    </nav>
</header>
<main>
<section>
    <h2>Sales History</h2>
    {% if sales %}
    <div class="table-wrap">
    <table>
        <thead><tr><th>ID</th><th>Book</th><th>Quantity</th><th>Total</th><th>Date</th></tr></thead>
        <tbody>
        {% for sale in sales %}
        <tr>
            <td>{{ sale.id }}</td><td>{{ sale.title }}</td><td>{{ sale.quantity }}</td>
            <td>₹{{ "%.2f"|format(sale.total) }}</td><td>{{ sale.sale_date }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
    {% else %}
      <p>No sales recorded yet.</p>
    {% endif %}
</section>
</main>
</body>
</html>
